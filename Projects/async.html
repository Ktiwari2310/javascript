<script>

    //same thing
    const sayHitesh = function(){

    //i want to make this change after 2 second

    const changetext = function(){
        document.querySelector('h1').innerHTML= "Best Javascript Series"

    }

    const changeme = setTimeout(changetext,2000)

    //if i clicked the stop button before 2 second then it shouldn't change

    //now event added to stop the changing of text

    document.querySelector('#stop').addEventListener('click',function(){
        console.log("Stopped");
        
        clearTimeout(changeme)

    })
