<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai aur Code</title>
</head>
<body style = "background-color: #212121; color:white;">
    <ul class="language">
        <li class="div">Javascript</li>


    </ul>
    
</body>
<script>
    const lang= "CPP"

    // function to add element and display
    function addlang (langname){
        const li =document.createElement('li')
        li.innerHTML= `${langname}`
        document.querySelector('.language').appendChild(li)
    }

    addlang("Cpp")   
    addlang("Python")



    //
    function optilang(langname){
        const li = document.createElement('li')
        li.appendChild(document.createTextNode(langname))
        document.querySelector('.language').appendChild(li)
    }
    optilang(`${lang}`)
    addlang("Python")


    //edit

    const secondlan = document.querySelector("li:nth-child(2)")
    // secondlan.innerHTML="Mojo"


    const newli =document.createElement('li')
    newli.textContent= "Mojo"
    secondlan.replaceWith(newli)


    //replace first js with ts
    const firstlan = document.querySelector("li:nth-child(1)")
    // firstlan.textContent="TypeScript"
    // firstlan.replaceWith(firstlan)
    firstlan.outerHTML="<li>TypeScript</li>"
    



    //remove
    //remove last language

    const lastlanguage = document.querySelector('li:last-child')
    lastlanguage.remove()

    





</script>
</html>
